[project]
name = "survey-analysis-eval-lab"
version = "0.1.0"
description = "NL analysis of CDC BRFSS survey data with survey-weighted estimates and an evaluation harness against CDC published values"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2,<3",
  "numpy>=1.26",
  "pyarrow>=15",
  "openai>=1.50,<2",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "samplics>=0.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
